name: Aggiornamento Automatico RSA

on:
  schedule:
    - cron: '0 */3 * * *' # Esegue lo scraping in automatico ogni 3 ore
  workflow_dispatch: # Permette anche l'avvio manuale dal sito GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui lo Scraper
        run: python cerca_rsa.py

      - name: Salva e carica le modifiche su GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add rsa_posti_liberi.json risultati_rsa.html index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico dei dati RSA [skip ci]" && git push)
